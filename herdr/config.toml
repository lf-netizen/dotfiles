# Daily controls plus the shipped Ctrl+B prefix and native prefix actions.
onboarding = false

[theme]
name = "kanagawa"
auto_switch = false

[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"

[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"

[keys]
goto = ["ctrl+shift+p", "prefix+g"]
toggle_sidebar = ["ctrl+shift+s", "prefix+b"]
new_tab = ["ctrl+shift+t", "prefix+c"]
previous_tab = ["ctrl+shift+comma", "ctrl+shift+[", "prefix+p"]
next_tab = ["ctrl+shift+period", "ctrl+shift+]", "prefix+n"]
rename_tab = ["ctrl+shift+r", "prefix+shift+t"]
new_workspace = ["ctrl+shift+n", "prefix+shift+n"]
previous_workspace = "ctrl+shift+h"
next_workspace = "ctrl+shift+l"
switch_workspace = "ctrl+cmd+1..9"
previous_agent = "ctrl+shift+k"
next_agent = "ctrl+shift+j"
# 9 runs the last-agent helper below.
focus_agent = ["ctrl+shift+1", "ctrl+shift+2", "ctrl+shift+3", "ctrl+shift+4", "ctrl+shift+5", "ctrl+shift+6", "ctrl+shift+7", "ctrl+shift+8"]
last_pane = "ctrl+shift+tab"
close_pane = ["ctrl+shift+w", "prefix+x"]
focus_pane_left = ["prefix+h"]
focus_pane_down = ["prefix+j"]
focus_pane_up = ["prefix+k"]
focus_pane_right = ["prefix+l"]
# Shared resize chords are routed below, so Neovim can handle its own splits.
resize_pane_left = []
resize_pane_down = []
resize_pane_up = []
resize_pane_right = []
split_vertical = ["ctrl+shift+backslash", "ctrl+shift+d", "prefix+v"]
split_horizontal = ["ctrl+shift+minus", "ctrl+shift+e", "prefix+minus"]
zoom = ["ctrl+shift+z", "prefix+z"]
copy_mode = ["ctrl+shift+c", "prefix+["]

[[keys.command]]
key = "ctrl+left"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus left'

[[keys.command]]
key = "ctrl+shift+left"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus left'

[[keys.command]]
key = "ctrl+down"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus down'

[[keys.command]]
key = "ctrl+shift+down"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus down'

[[keys.command]]
key = "ctrl+up"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus up'

[[keys.command]]
key = "ctrl+shift+up"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus up'

[[keys.command]]
key = "ctrl+right"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus right'

[[keys.command]]
key = "ctrl+shift+right"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" focus right'

[[keys.command]]
key = "ctrl+shift+alt+left"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize left'

[[keys.command]]
key = "ctrl+shift+alt+down"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize down'

[[keys.command]]
key = "ctrl+shift+alt+up"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize up'

[[keys.command]]
key = "ctrl+shift+alt+right"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize right'

[[keys.command]]
key = "ctrl+shift+alt+h"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize left'

[[keys.command]]
key = "ctrl+shift+alt+j"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize down'

[[keys.command]]
key = "ctrl+shift+alt+k"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize up'

[[keys.command]]
key = "ctrl+shift+alt+l"
type = "shell"
command = 'python3 "$HOME/.config/herdr/splits.py" resize right'

[[keys.command]]
key = "ctrl+shift+9"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-last-agent.py"'

[[keys.command]]
key = "ctrl+shift+o"
type = "shell"
command = 'python3 "$HOME/.config/herdr/focus-last-agent.py" --attention'

[ui]
sidebar_width = 38
sidebar_min_width = 38
sidebar_max_width = 48
sidebar_start_collapsed = false
sidebar_collapsed_mode = "hidden"
tab_bar_position = "bottom"
tab_bar_right = [{ type = "zoom" }]
prompt_new_tab_name = false
prompt_new_workspace_name = true
confirm_close = false
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
show_agent_labels_on_pane_borders = true
# Keep workspace/tab order; priority mode moves unseen done/blocked agents.
agent_panel_sort = "spaces"
status_indicators = "symbols"
window_title = "{workspace}: {tab}"

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "tab", bold = true, dim = false }],

  [{ token = "workspace", bold = false, dim = true }, "agent"],
]

[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true
