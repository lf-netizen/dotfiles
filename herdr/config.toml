# Daily controls plus the shipped Ctrl+B prefix and native prefix actions.
onboarding = false
[theme]
name = "kanagawa"
auto_switch = false
[theme.custom]
panel_bg = "reset"
sidebar_bg = "reset"
[terminal]
default_shell = "/bin/zsh"
shell_mode = "auto"
new_cwd = "follow"
[keys]
goto = ["ctrl+shift+p", "prefix+g"]
toggle_sidebar = ["ctrl+shift+s", "prefix+b"]
new_tab = ["ctrl+shift+t", "prefix+c"]
# Native brackets work in the Ghostty trial; U/I remains a WezTerm fallback.
previous_tab = ["ctrl+shift+[", "ctrl+shift+u", "prefix+p"]
next_tab = ["ctrl+shift+]", "ctrl+shift+i", "prefix+n"]
new_workspace = ["ctrl+shift+n", "prefix+shift+n"]
previous_workspace = "ctrl+shift+h"
next_workspace = "ctrl+shift+l"
switch_workspace = "ctrl+cmd+1..9"
previous_agent = "ctrl+shift+k"
next_agent = "ctrl+shift+j"
focus_agent = "ctrl+shift+1..9"
last_pane = "ctrl+shift+tab"
close_pane = ["ctrl+shift+w", "prefix+x"]
focus_pane_left = ["ctrl+shift+left", "prefix+h"]
focus_pane_down = ["ctrl+shift+down", "prefix+j"]
focus_pane_up = ["ctrl+shift+up", "prefix+k"]
focus_pane_right = ["ctrl+shift+right", "prefix+l"]
resize_pane_left = "ctrl+shift+alt+left"
resize_pane_down = "ctrl+shift+alt+down"
resize_pane_up = "ctrl+shift+alt+up"
resize_pane_right = "ctrl+shift+alt+right"
split_vertical = ["ctrl+shift+d", "prefix+v"]
split_horizontal = ["ctrl+shift+e", "prefix+minus"]
zoom = ["ctrl+shift+z", "prefix+z"]
copy_mode = ["ctrl+shift+c", "prefix+["]
[ui]
sidebar_start_collapsed = false
sidebar_collapsed_mode = "hidden"
tab_bar_position = "bottom"
tab_bar_right = [{ type = "zoom" }]
prompt_new_tab_name = false
prompt_new_workspace_name = true
confirm_close = false
pane_gaps = false
pane_outer_borders = false
pane_scrollbars = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"
status_indicators = "symbols"
window_title = "{workspace}: {tab}"
[ui.toast]
delivery = "system"
delay_seconds = 1
[ui.sound]
enabled = true
[session]
resume_agents_on_restore = true
