# Keep LazyGit's default panel arrangement and keybindings.
gui:
  showNumstatInFilesView: true
  shrinkSidePanelsToContent: true
  # Fixed line count: approximate half-page scrolling for Ctrl+U / Ctrl+D.
  # Also applies to PgUp/PgDn, Shift+J/K, and mouse-wheel scrolling.
  scrollHeight: 15

git:
  diffRenderers:
    - name: delta
      command: >-
        delta --dark --paging=never --true-color=always
        --syntax-theme=kanagawa --line-numbers
        --hunk-header-style="line-number syntax"
        --line-numbers-zero-style="#7C7C99"
        --line-numbers-minus-style="#C34043" --line-numbers-plus-style="#76946A"
        --minus-style="syntax #43242B" --minus-emph-style="syntax bold #43242B"
        --plus-style="syntax #2B3328" --plus-emph-style="syntax bold #2B3328"
    - name: color-words
      type: rawGit
      args: [--color-words]
