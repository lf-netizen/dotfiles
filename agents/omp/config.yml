setupVersion: 2
modelRoles:
  default: openai-codex/gpt-6-astra:medium
  smol: openai-codex/gpt-5.6-luna:medium
  tiny: openai-codex/gpt-5.3-codex-spark:low
  slow: openai-codex/gpt-6-astra:high
  plan: openai-codex/gpt-6-astra:high
  vision: openai-codex/gpt-6-astra:medium
display:
  hideToolActivity: false
composer:
  shape: claude
dev:
  autoqaConsent: denied
statusLine:
  preset: custom
  leftSegments: [pi, vim, model, mode, collab, path, git, pr, context_pct, cost, status]
  rightSegments: [session_name]
  showHookStatus: false
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: true
